name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend base URL (trailing slash added automatically)'
        required: false
        default: 'http://192.168.178.176:8000/'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Generate Gradle wrapper if missing
        working-directory: android
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::Gradle wrapper incomplete - generating it. Commit gradlew, gradlew.bat and gradle-wrapper.jar to fix this properly."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace \
            -PbackendBaseUrl="${{ github.event.inputs.backend_url || 'http://192.168.178.176:8000/' }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: groceries-hero-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
