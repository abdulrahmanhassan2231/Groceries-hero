name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ip_address:
        description: 'Your PC IP Address (e.g., 192.168.1.5)'
        required: true
        default: '192.168.1.100'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and build project
        env:
          SERVER_URL: http://${{ github.event.inputs.ip_address }}:8000
        run: |
          # Finds where gradlew is hidden in the repository and runs it
          PROJECT_DIR=$(dirname $(find . -name "gradlew" -print -quit))
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grocery-App-Debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
