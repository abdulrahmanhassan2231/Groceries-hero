name: Build Android APK
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
 
      - name: Build Debug APK with custom IP
        run: |
          # android/ is at the repo root — no nested path needed
          cd android
          chmod +x gradlew
          # Inject backend base URL from a GitHub secret (set it in repo Settings → Secrets)
          # If your app hard-codes the URL, remove the -P flag below
          ./gradlew assembleDebug \
            -PbackendBaseUrl="${{ secrets.BACKEND_BASE_URL }}"
 
      - name: Upload APK Artifact
        uses: actions/upload-artifact@
